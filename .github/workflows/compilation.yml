name: CI

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  ps2:
    runs-on: ubuntu-latest
    container: ps2dev/ps2sdk:latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup dependencies
      run: |
        apk update
        apk add build-base cmake gmp mpc1 mpfr4 make

    - name: Configure with CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build project with CMake
      run: |
        cd build
        make -j $(getconf _NPROCESSORS_ONLN)

    - name: Validate IRX image
      run: |
        cmake --build build --target ps2_drivers_irximg_check
        cmake --build build --target ps2_drivers_irximg_stage_check
        cmake --build build --target ps2_drivers_hdd_launch_check
        cmake --build build --target ps2_drivers_bootstrap_args_check
        cmake --build build --target ps2_drivers_ata_bdm_launch_check
        cmake --build build --target ps2_drivers_irximg_inspect
        cmake --build build --target ps2_drivers_img_payload_check
        cmake --build build --target hdd_smoke_package
        cmake --build build --target ata_r3z_smoke_package

    - name: Install library
      run: |
        cd build
        make install

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: libps2_drivers-${{ steps.slug.outputs.sha8 }}
        path: |
          build/*.a
          build/*.irximg
          build/ps2_drivers_irximg_bootstrap.elf
          build/samples/**/*.elf
          build/samples/hdd_boot_smoke/HDD_SMOKE.zip
          build/samples/ata_bdm_sample/ATA_R3Z_SMOKE.zip
